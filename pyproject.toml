[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ymap-research-framework"
version = "0.5.0"
description = "Schema recommendation with explicit measurement provenance and system-level evaluation"
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.3", "PyYAML>=6.0", "joblib>=1.3", "sqlglot>=30.24,<31", "openpyxl>=3.1"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
neural = ["torch>=2.6,<3", "transformers>=4.40,<5", "safetensors>=0.4", "sentencepiece>=0.2"]
paper-int4 = ["accelerate>=0.26,<2", "bitsandbytes>=0.43,<1"]
xgboost = ["xgboost>=2.0"]
plots = ["matplotlib>=3.7"]
release = ["build>=1.2", "markdown2>=2.5"]

[project.scripts]
ymap = "ymap_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ymap_research = ["java/*.java", "examples/object_models/*.json"]
